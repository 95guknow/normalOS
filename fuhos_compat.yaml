# Plattform-Kompatibilität mit Fusion Hero OS (95guknow/fusion-hero-os).
# Quelle der Wahrheit für die Plattform-Version sind die Release-Tags vX.Y.Z
# auf main dort — Schema siehe BRANCH_STRATEGY.md -> Versionierung.
#
# Die Obergrenze <9 stammte aus der v8-Ära und schloss die laufende
# Plattform (13.0.1) aus — normalOS las sich damit als inkompatibel.
# Getragen wird die Spanne von der Backward Compatibility Guarantee:
# v10 und v13 sind laut BEST_VERSION.md additiv über dem v8.3-Funktionskern,
# den dieses Repo nutzt. Das ist eine abgeleitete Zusage, kein Testbefund —
# gegen v13 selbst ist hier nichts verifiziert (Code Honesty).
fuhos_compat: ">=8.3 <14"
